name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Tests and validate must never depend on the remote registry.
      OPENSCAFFOLD_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run validate
      - run: bun run build
      - name: Smoke test the built CLI under Node
        run: |
          node dist/cli.js --version
          node dist/cli.js list --json > /dev/null

  # The Claude Code hooks target stock macOS bash 3.2 (/bin/bash). The hook
  # tests run under /bin/bash as well as the bash on PATH.
  hooks-macos:
    runs-on: macos-latest
    env:
      OPENSCAFFOLD_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # jq ships on the runner image; shellcheck exercises the lint-on-write path.
      - run: command -v shellcheck || brew install shellcheck
      - run: /bin/bash --version
      - run: bunx vitest run tests/hooks.test.ts
