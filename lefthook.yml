pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json,jsonc}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
    registry:
      glob: "registry/**"
      run: bun src/cli.ts validate registry

commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\(.+\))?!?: .+' || {
          echo "commit message must follow Conventional Commits (e.g. 'feat(cli): add verify --only')"
          exit 1
        }

pre-push:
  commands:
    check:
      # Checks the pushed commits in a clean worktree, not the working tree.
      run: scripts/pre-push.sh
      use_stdin: true
